name: Profile cards

# Renders assets/header-{dark,light}.svg and assets/project-*-{dark,light}.svg
# and commits them when they change.
#
# This replaces the GitHub Stats workflow, which failed every run from the day
# it was added: waka-readme-stats calls GET /user, and the built-in GITHUB_TOKEN
# is an installation token with no user identity, so it 403s. The fix it wanted
# was a personal access token. This needs none — the contribution calendar is
# public and read anonymously, and the optional Claude Code gist is public too.
#
# If a source fails the script throws before writing, this job goes red, and the
# last good card stays committed. A stale card beats a card with a wrong number.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/header.json"
      - "data/projects.json"
      - "scripts/profile-cards.mjs"
      - "scripts/project-cards.mjs"
      - ".github/workflows/profile-cards.yml"
  schedule:
    # 05:40 UTC. Deliberately not 12:00, when the WakaTime job commits to
    # README.md on this same branch; two jobs pushing at once is a lost race.
    - cron: "40 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render
        env:
          GH_USER: harsh-chandak
          # Set this repository variable once the nightly Claude Code gist
          # exists; until then the live strip simply omits those figures.
          CLAUDE_STATS_GIST: ${{ vars.CLAUDE_STATS_GIST }}
        run: node scripts/profile-cards.mjs --out assets

      - name: Render project cards
        env:
          GH_USER: harsh-chandak
          # Only to raise the unauthenticated rate limit; the script reads the
          # same public repository fields either way.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/project-cards.mjs --out assets

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain assets)" ]]; then
            echo "cards unchanged"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Profile cards: refresh live figures"
          # Concurrency queues a second run but does not re-checkout it, so a
          # queued run pushes from a ref that is already stale and is rejected.
          # The WakaTime job commits README.md on this same branch, so this is
          # a normal condition, not an error. Rebase onto whatever landed and
          # retry; the two jobs never touch the same files.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i lost a race, retrying"; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
