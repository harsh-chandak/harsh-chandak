# Rewrites the block between the waka markers in README.md once a day.
#
# WakaTime measures editor time, so it only ever reflects what was typed in an
# editor with the plugin running. Work done in a terminal, in review, or on
# paper does not appear, and the number is not a measure of output.
#
# Requires a WAKATIME_API_KEY repository secret. Without it the step fails and
# the README is left exactly as it is, which is the correct failure.
name: WakaTime README

on:
  schedule:
    # 12:00 UTC is 05:00 Phoenix, so the block is already updated by morning.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: "false"
          # The free plan keeps 14 days of history, so a longer range is empty.
          TIME_RANGE: last_7_days
          LANG_COUNT: "6"
          BLOCKS: "░▒▓█"
          CODE_LANG: "text"
          COMMIT_MESSAGE: "Update coding time"
