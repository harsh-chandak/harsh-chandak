# Rewrites the block between the github markers in README.md once a day.
#
# This half is real GitHub history — commits by hour and weekday, language mix
# across repos — so it has data from the first run, unlike the WakaTime block
# which starts empty and fills in.
#
# Runs an hour after the WakaTime workflow. Both commit to README.md, and two
# jobs pushing to the same branch in the same minute is a losing race.
name: GitHub Stats

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Its own markers, so the WakaTime block stays untouched.
          SECTION_NAME: github

          # Real GitHub history. Present from the first run.
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_UPDATED_DATE: "True"

          # Publishes WakaTime project names. Those include client work and a
          # private job search, on a public page. Off, deliberately.
          SHOW_PROJECTS: "False"

          # Noise, or vanity, or metrics that reward the wrong thing.
          SHOW_OS: "False"
          SHOW_EDITORS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"

          # WakaTime-backed, so empty until the trackers have a few days.
          SHOW_LANGUAGE: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"

          # Commit as the bot, so this does not inflate the contribution graph
          # it is reporting on.
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "Update activity"
