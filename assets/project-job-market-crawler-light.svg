<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Job Market Crawler. Polls ATS boards directly and ranks every posting deterministically before it spends a single model call. 3,547 ATS boards polled. 85% of 28K daily polls skipped. 0 model calls to screen. Built with Node.js · MongoDB · conditional GET · Typst.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2f9"/><stop offset="1" stop-color="#dbe4f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="4%" r="64%">
      <stop offset="0" stop-color="#8a5e0a" stop-opacity=".085"/>
      <stop offset="1" stop-color="#8a5e0a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n { font: 700 72px -apple-system, "Segoe UI", Inter, sans-serif; letter-spacing:-2.4px; fill:#1a2338 }
      .r { font: 400 27px -apple-system, "Segoe UI", Inter, sans-serif; fill:#1a2338; opacity:.9 }
      .m { font: 400 17px -apple-system, "Segoe UI", Inter, sans-serif; fill:#5a6684 }
      .k { font: 700 32px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#8a5e0a }
      .l { font: 400 14px -apple-system, "Segoe UI", Inter, sans-serif; fill:#5a6684 }
      .s { font: 400 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#5a6684 }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <circle cx="54" cy="74" r="6" fill="#8a5e0a"/>
  <text x="74" y="80" class="l" letter-spacing="2.6">JOB PIPELINE</text>

  <text x="50" y="214" class="n">Job Market Crawler</text>
  <text x="50" y="276" class="r">Polls ATS boards directly and ranks every posting</text>
  <text x="50" y="314" class="r">deterministically before it spends a single model call.</text>

  <line x1="50" y1="398" x2="1230" y2="398" stroke="#bdc9da"/>
  <g>
    <text x="50" y="458" class="k">3,547</text>
    <text x="50" y="488" class="m">ATS boards polled</text>
    <text x="443" y="458" class="k">85%</text>
    <text x="443" y="488" class="m">of 28K daily polls skipped</text>
    <text x="837" y="458" class="k">0</text>
    <text x="837" y="488" class="m">model calls to screen</text>
  </g>

  <line x1="50" y1="548" x2="1230" y2="548" stroke="#bdc9da"/>
  <text x="50" y="586" class="s">Node.js · MongoDB · conditional GET · Typst</text>
  <text x="1230" y="586" class="s" text-anchor="end">github.com/harsh-chandak/job-market-crawler</text>
  <text x="1230" y="80" class="l" text-anchor="end">★ 2   ·   MIT</text>
</svg>
