<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Maryland Crash Atlas. Linked D3 views over public crash reports, where selecting in any chart filters the map with it. 32K crash records mapped. 6 linked views. GeoJSON ZIP boundaries. Built with D3.js · Node.js · GeoJSON · data.gov.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2f9"/><stop offset="1" stop-color="#dbe4f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="4%" r="64%">
      <stop offset="0" stop-color="#8a5e0a" stop-opacity=".085"/>
      <stop offset="1" stop-color="#8a5e0a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n { font: 700 72px -apple-system, "Segoe UI", Inter, sans-serif; letter-spacing:-2.4px; fill:#1a2338 }
      .r { font: 400 27px -apple-system, "Segoe UI", Inter, sans-serif; fill:#1a2338; opacity:.9 }
      .m { font: 400 17px -apple-system, "Segoe UI", Inter, sans-serif; fill:#5a6684 }
      .k { font: 700 32px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#8a5e0a }
      .l { font: 400 14px -apple-system, "Segoe UI", Inter, sans-serif; fill:#5a6684 }
      .s { font: 400 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#5a6684 }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <circle cx="54" cy="74" r="6" fill="#8a5e0a"/>
  <text x="74" y="80" class="l" letter-spacing="2.6">DATA VISUALIZATION</text>

  <text x="50" y="214" class="n">Maryland Crash Atlas</text>
  <text x="50" y="276" class="r">Linked D3 views over public crash reports, where selecting in any chart filters the map with it.</text>

  <line x1="50" y1="398" x2="1230" y2="398" stroke="#bdc9da"/>
  <g>
    <text x="50" y="458" class="k">32K</text>
    <text x="50" y="488" class="m">crash records mapped</text>
    <text x="443" y="458" class="k">6</text>
    <text x="443" y="488" class="m">linked views</text>
    <text x="837" y="458" class="k">GeoJSON</text>
    <text x="837" y="488" class="m">ZIP boundaries</text>
  </g>

  <line x1="50" y1="548" x2="1230" y2="548" stroke="#bdc9da"/>
  <text x="50" y="586" class="s">D3.js · Node.js · GeoJSON · data.gov</text>
  <text x="1230" y="586" class="s" text-anchor="end">github.com/harsh-chandak/data-vis</text>
  <text x="1230" y="80" class="l" text-anchor="end">★ 2</text>
</svg>
