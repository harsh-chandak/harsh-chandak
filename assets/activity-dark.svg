<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Public GitHub activity: 2,625 contributions, last year, 124 days with a commit, 25 longest streak, days, 6 public repositories.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17130f"/><stop offset="1" stop-color="#241c14"/></linearGradient>
    <radialGradient id="glow" cx="82%" cy="6%" r="64%"><stop offset="0" stop-color="#f5a524" stop-opacity=".18"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
    <style>
      .k { font: 700 30px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#f5a524 }
      .m { font: 400 13px -apple-system, "Segoe UI", Inter, sans-serif; fill:#b09b84 }
      .l { font: 400 11px -apple-system, "Segoe UI", Inter, sans-serif; fill:#b09b84 }
    </style>
  </defs>
  <rect width="900" height="190" rx="14" fill="url(#bg)"/>
  <rect width="900" height="190" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="899" height="189" rx="14" fill="none" stroke="#413326"/>
  <circle cx="52" cy="40" r="5" fill="#f5a524"/>
  <text x="68" y="45" class="l" letter-spacing="2.2">ACTIVITY, PUBLIC REPOSITORIES ONLY</text>
  <line x1="50" y1="70" x2="850" y2="70" stroke="#413326"/>
  <text x="50" y="124" class="k">2,625</text>
  <text x="50" y="150" class="m">contributions, last year</text>
  <text x="250" y="124" class="k">124</text>
  <text x="250" y="150" class="m">days with a commit</text>
  <text x="450" y="124" class="k">25</text>
  <text x="450" y="150" class="m">longest streak, days</text>
  <text x="650" y="124" class="k">6</text>
  <text x="650" y="150" class="m">public repositories</text>
</svg>
