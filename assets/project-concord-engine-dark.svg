<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Concord Engine. Holds a fleet of coding agents to one set of decisions, so four workers cannot each answer the same question reasonably and differently. 103 unit tests. 60 case loop matrix. 12 MCP tools. Built with TypeScript · Node · MCP · npm.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/><stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="4%" r="64%">
      <stop offset="0" stop-color="#f0b429" stop-opacity=".085"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n { font: 700 72px -apple-system, "Segoe UI", Inter, sans-serif; letter-spacing:-2.4px; fill:#e8ecf7 }
      .r { font: 400 27px -apple-system, "Segoe UI", Inter, sans-serif; fill:#e8ecf7; opacity:.9 }
      .m { font: 400 17px -apple-system, "Segoe UI", Inter, sans-serif; fill:#95a2c0 }
      .k { font: 700 32px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#f0b429 }
      .l { font: 400 14px -apple-system, "Segoe UI", Inter, sans-serif; fill:#95a2c0 }
      .s { font: 400 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#95a2c0 }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <circle cx="54" cy="74" r="6" fill="#f0b429"/>
  <text x="74" y="80" class="l" letter-spacing="2.6">AGENT ORCHESTRATION</text>

  <text x="50" y="214" class="n">Concord Engine</text>
  <text x="50" y="276" class="r">Holds a fleet of coding agents to one set of decisions, so four workers</text>
  <text x="50" y="314" class="r">cannot each answer the same question reasonably and differently.</text>

  <line x1="50" y1="398" x2="1230" y2="398" stroke="#1e2a3b"/>
  <g>
    <text x="50" y="458" class="k">103</text>
    <text x="50" y="488" class="m">unit tests</text>
    <text x="443" y="458" class="k">60</text>
    <text x="443" y="488" class="m">case loop matrix</text>
    <text x="837" y="458" class="k">12</text>
    <text x="837" y="488" class="m">MCP tools</text>
  </g>

  <line x1="50" y1="548" x2="1230" y2="548" stroke="#1e2a3b"/>
  <text x="50" y="586" class="s">TypeScript · Node · MCP · npm</text>
  <text x="1230" y="586" class="s" text-anchor="end">github.com/harsh-chandak/concord-engine</text>
  <text x="1230" y="80" class="l" text-anchor="end">MIT</text>
</svg>
