<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Sign Language Detection. Reads American Sign Language from a webcam by classifying hand keypoints rather than raw frames. Keypoints not image frames. MediaPipe hand landmarks. Feed-forward network, trained on ASL. Built with Python · MediaPipe · feed-forward neural network.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130f"/><stop offset="1" stop-color="#241c14"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="4%" r="64%">
      <stop offset="0" stop-color="#f5a524" stop-opacity=".20"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n { font: 700 72px -apple-system, "Segoe UI", Inter, sans-serif; letter-spacing:-2.4px; fill:#f6efe6 }
      .r { font: 400 27px -apple-system, "Segoe UI", Inter, sans-serif; fill:#f6efe6; opacity:.9 }
      .m { font: 400 17px -apple-system, "Segoe UI", Inter, sans-serif; fill:#b09b84 }
      .k { font: 700 32px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#f5a524 }
      .l { font: 400 14px -apple-system, "Segoe UI", Inter, sans-serif; fill:#b09b84 }
      .s { font: 400 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#b09b84 }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <circle cx="54" cy="74" r="6" fill="#f5a524"/>
  <text x="74" y="80" class="l" letter-spacing="2.6">REAL-TIME CLASSIFICATION</text>

  <text x="50" y="214" class="n">Sign Language Detection</text>
  <text x="50" y="276" class="r">Reads American Sign Language from a webcam by classifying hand keypoints rather than raw frames.</text>

  <line x1="50" y1="398" x2="1230" y2="398" stroke="#413326"/>
  <g>
    <text x="50" y="458" class="k">Keypoints</text>
    <text x="50" y="488" class="m">not image frames</text>
    <text x="443" y="458" class="k">MediaPipe</text>
    <text x="443" y="488" class="m">hand landmarks</text>
    <text x="837" y="458" class="k">Feed-forward</text>
    <text x="837" y="488" class="m">network, trained on ASL</text>
  </g>

  <line x1="50" y1="548" x2="1230" y2="548" stroke="#413326"/>
  <text x="50" y="586" class="s">Python · MediaPipe · feed-forward neural network</text>
  <text x="1230" y="586" class="s" text-anchor="end">harsh-chandak.com</text>
  
</svg>
